[project]
name = "otelfeature-instrument"
version = "0.3.0"
description = "Zero-code OpenTelemetry launcher with live, flagd-controlled internal-span suppression"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "openfeature-provider-flagd==0.6.0",
    "openfeature-sdk==0.10.0",
    # NOTE: opentelemetry-* packages release in lockstep and are pinned
    # exactly. They can't be updated individually, so Dependabot ignores
    # them and .github/workflows/upgrade-otel-deps.yml bumps the whole
    # family together (pyproject.toml + uv.lock) every week.
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation==0.66b1",
    "opentelemetry-sdk==1.45.1",
]

[project.optional-dependencies]
# Opt-in recording of the extension's own flag evaluations as span events,
# enabled with OTELFEATURE_OPENFEATURE_TRACING_HOOK=true (see README).
tracing-hook = ["openfeature-hooks-opentelemetry==0.3.1"]

[project.scripts]
otelfeature-instrument = "otelfeature_instrument.cli:run"

[dependency-groups]
dev = ["pytest==9.1.1", "otelfeature-instrument[tracing-hook]"]

[build-system]
# Pinned so a release build is reproducible.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/otelfeature_instrument"]
