[project]
name = "otelfeature-instrument"
version = "0.1.0"
description = "Zero-code OpenTelemetry launcher with live, flagd-controlled internal-span suppression"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "openfeature-provider-flagd==0.5.2",
    "openfeature-sdk==0.10.0",
    # NOTE: opentelemetry-* packages release in lockstep and constrain each
    # other to the same minor version, so they can't be exact-pinned
    # (Dependabot would fail on any single-package update — see
    # https://github.com/dependabot/dependabot-core/issues/16390).
    # uv.lock still pins exact versions for reproducible installs.
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
    "opentelemetry-instrumentation>=0.65b0,<1",
    "opentelemetry-sdk>=1.44.0,<2",
]

[project.scripts]
otelfeature-instrument = "otelfeature_instrument.cli:run"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otelfeature_instrument"]
