[project]
name = "otelfeature-instrument"
version = "0.1.0"
description = "Zero-code OpenTelemetry launcher with live, flagd-controlled internal-span suppression"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "openfeature-provider-flagd==0.5.2",
    "openfeature-sdk==0.10.0",
    # NOTE: opentelemetry-* packages release in lockstep and are pinned
    # exactly. They can't be updated individually, so Dependabot ignores
    # them and .github/workflows/upgrade-otel-deps.yml bumps the whole
    # family together (pyproject.toml + uv.lock) every week.
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation==0.66b1",
    "opentelemetry-sdk==1.45.1",
]

[project.scripts]
otelfeature-instrument = "otelfeature_instrument.cli:run"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otelfeature_instrument"]
