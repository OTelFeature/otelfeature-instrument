# Dependabot configuration for otelfeature-instrument
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Python dependencies managed by uv (uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      # OTel Python packages release in lockstep and constrain each other to
      # the same minor version (e.g. sdk>=1.44.0,<1.45.dev0), and we pin them
      # exactly — updating any single one is unsatisfiable. They must be
      # grouped so they bump together in one PR. Keep this group listed FIRST:
      # the first matching group wins.
      opentelemetry:
        applies-to: version-updates
        patterns: ["opentelemetry-*"]
      # Same lockstep constraint applies if a security release drops for one
      # of them — grouped separately so they can't be pulled out individually.
      opentelemetry-security:
        applies-to: security-updates
        patterns: ["opentelemetry-*"]
      # Group all security advisories into a single PR
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
      # Group minor & patch version bumps together
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Major updates are intentionally NOT grouped → individual PRs
    commit-message:
      prefix: "deps"
      include: "scope"

  # NOTE: the github-actions updater was removed because this repo has no
  # .github/workflows yet — Dependabot errored on every run with
  # "couldn't find a <anything>.yml". Re-add this block once CI workflows exist:
