# Dependabot configuration for otelfeature-instrument
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# NOTE: the opentelemetry-* family is NOT handled here — it's upgraded by
# .github/workflows/upgrade-otel-deps.yml (see the ignore list below).

version: 2

updates:
  # Python dependencies managed by uv (uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    # The opentelemetry-* packages release in lockstep and are pinned with ==
    # in pyproject.toml, and Dependabot's uv updater resolves each dependency
    # individually, so it can never update them — every attempt fails with an
    # unsatisfiable resolution error
    # (https://github.com/dependabot/dependabot-core/issues/16390). The weekly
    # .github/workflows/upgrade-otel-deps.yml job upgrades the whole family
    # together instead. Listed explicitly rather than "opentelemetry-*" for
    # reliable matching.
    ignore:
      - dependency-name: "opentelemetry-api"
      - dependency-name: "opentelemetry-exporter-otlp-proto-http"
      - dependency-name: "opentelemetry-instrumentation"
      - dependency-name: "opentelemetry-sdk"
    groups:
      # Group all security advisories into a single PR
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
      # Group minor & patch version bumps together
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Major updates are intentionally NOT grouped → individual PRs
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions used by CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"
