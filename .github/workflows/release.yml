# Release: pushing a `v*` tag builds the wheel and sdist in the toolchain image
# (ci/Dockerfile) and publishes them as a GitHub Release (spec C-006).
# `v<version>-rc.N` tags become pre-releases. PyPI publishing is out of scope.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the toolchain image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/Dockerfile
          tags: otelfeature-instrument-ci
          load: true
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image

      # v<version> or v<version>-rc.N, <version> being pyproject.toml's
      # version (and __version__); -rc.N makes it a pre-release.
      - name: Check the tag matches the package version
        id: version
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/workspace -w /workspace otelfeature-instrument-ci \
            python ci/check_tag_version.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Test
        run: make test-only

      - name: Build wheel and sdist
        run: docker run --rm -v "$PWD":/workspace -w /workspace otelfeature-instrument-ci uv build --out-dir dist

      # Idempotent: a re-run (e.g. after a failed upload) re-uploads the
      # assets to the existing release instead of failing.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            prerelease=()
            if [[ "$PRERELEASE" == "true" ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "${prerelease[@]}"
          fi
