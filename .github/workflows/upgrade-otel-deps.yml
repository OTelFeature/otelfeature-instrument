# Weekly lockstep upgrade for the opentelemetry-* family (pyproject.toml + uv.lock).
#
# Why not Dependabot? The OTel Python packages release in lockstep and are
# pinned with == in pyproject.toml, but Dependabot's uv updater resolves each
# dependency update individually, so it can never update them
# (https://github.com/dependabot/dependabot-core/issues/16390). This workflow
# runs scripts/upgrade_otel_pins.py, which bumps the whole family together,
# then opens a pull request. Dependabot still covers everything else
# (openfeature-*, pytest, actions) — see .github/dependabot.yml.
name: Upgrade OTel dependencies

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, same cadence as Dependabot
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upgrade-otel-deps
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Upgrade the opentelemetry-* family
        run: |
          set -eo pipefail
          python scripts/upgrade_otel_pins.py 2>&1 | tee otel-upgrade.log

      - name: Run tests
        run: |
          set -o pipefail
          if uv run --quiet pytest -q 2>&1 | tee -a otel-upgrade.log; then
            echo "Tests: passed" | tee -a otel-upgrade.log
          else
            echo "Tests: FAILED — review carefully before merging" | tee -a otel-upgrade.log
          fi

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No opentelemetry-* updates available; nothing to do."
            exit 0
          fi
          BRANCH="chore/upgrade-otel-deps"
          TITLE="chore(deps): upgrade the opentelemetry-* family ($(date -u +%Y-%m-%d))"
          {
            echo "Automated lockstep upgrade of the \`opentelemetry-*\` family — bumps \`pyproject.toml\` **and** \`uv.lock\` together (Dependabot can't do this: [dependabot-core#16390](https://github.com/dependabot/dependabot-core/issues/16390))."
            echo ""
            echo '```'
            cat otel-upgrade.log
            echo '```'
            echo ""
            echo "_Auto-generated by \`.github/workflows/upgrade-otel-deps.yml\` — review the test result above._"
          } > pr-body.md
          git checkout -B "$BRANCH"
          git add pyproject.toml uv.lock
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          gh label create dependencies --force --description "Dependency updates" >/dev/null 2>&1 || true
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file pr-body.md
            echo "Updated existing PR #$EXISTING."
          else
            gh pr create --title "$TITLE" --body-file pr-body.md --label dependencies
          fi
